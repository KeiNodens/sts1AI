[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "sts1-ai-tools"
version = "0.1.0"
description = "Local Slay the Spire 1 co-op tools and MCP bridge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{name = "KeiNodens"}]
dependencies = ["mcp==1.26.0", "httpx==0.28.1"]

[project.scripts]
sts1-mcp = "mcp_bridge.server:main"

[tool.setuptools]
py-modules = ["sts1_bridge"]

[tool.setuptools.packages.find]
include = ["advisor*", "mcp_bridge*", "tools*"]

[tool.setuptools.package-data]
advisor = ["*.json"]
